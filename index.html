<!doctype html>
<html lang="bs" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledgerly — kućni budžet</title>
    <meta name="description" content="Pregled kućnih prihoda i rashoda po mjesecu, kvartalu i godini." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Primijeni zapamćenu temu prije prvog iscrtavanja da nema bljeska.
      try {
        var t = localStorage.getItem('ledgerly.theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
